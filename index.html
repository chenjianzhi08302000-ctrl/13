<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北 101 大樓 (Taipei 101) 3D 數位孿生與互動視覺化</title>
  <meta name="description" content="使用 Three.js 打造的高精度台北 101 大樓 3D 數位模型，支援日夜光影、一週七色光雕、風阻尼球內部透視、跨年煙火秀與多角度導覽。">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js & OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;600;700;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Outfit', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    /* Clean custom styling for glassmorphism HUD */
    body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; user-select: none; }
    #webgl-canvas { width: 100%; height: 100%; display: block; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .beacon-pulse {
      animation: beaconFlash 1s infinite alternate;
    }
    @keyframes beaconFlash {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

  <!-- ================= 3D CANVAS ================= -->
  <div id="canvas-container" class="relative w-full h-full">
    <canvas id="webgl-canvas"></canvas>

    <!-- ================= TOP HUD: TITLE & STATS ================= -->
    <header class="absolute top-4 left-4 right-4 z-20 flex flex-wrap items-center justify-between pointer-events-none gap-3">
      <!-- Left: Title Banner -->
      <div class="glass-panel px-4 py-2.5 rounded-2xl pointer-events-auto flex items-center gap-3 shadow-2xl">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 via-teal-600 to-cyan-700 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
          <i data-lucide="building-2" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-1.5">
              TAIPEI 101 <span class="text-emerald-400">台北 101</span>
            </h1>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
              508m • 101F
            </span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">
            東方寶塔節節高升幾何 • 660噸黃金阻尼球 • 八節竹節倒梯形
          </p>
        </div>
      </div>

      <!-- Right: Mode Switches (Day/Sunset/Night, Auto-rotate, Sound) -->
      <div class="glass-panel p-1.5 rounded-2xl pointer-events-auto flex items-center gap-1 shadow-2xl">
        <button onclick="setLightingTime('day')" id="btnDay" class="time-btn px-2.5 py-1.5 rounded-xl text-xs font-bold text-slate-300 hover:text-white hover:bg-white/10 transition flex items-center gap-1">
          <i data-lucide="sun" class="w-3.5 h-3.5 text-amber-400"></i>
          <span class="hidden md:inline">日間</span>
        </button>
        <button onclick="setLightingTime('sunset')" id="btnSunset" class="time-btn px-2.5 py-1.5 rounded-xl text-xs font-bold text-slate-300 hover:text-white hover:bg-white/10 transition flex items-center gap-1">
          <i data-lucide="sunset" class="w-3.5 h-3.5 text-orange-400"></i>
          <span class="hidden md:inline">黃昏</span>
        </button>
        <button onclick="setLightingTime('night')" id="btnNight" class="time-btn active px-2.5 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white transition flex items-center gap-1">
          <i data-lucide="moon" class="w-3.5 h-3.5 text-indigo-300"></i>
          <span class="hidden md:inline">璀璨夜景</span>
        </button>

        <div class="h-4 w-px bg-white/20 mx-1"></div>

        <button onclick="toggleAutoRotate()" id="btnRotate" class="p-2 rounded-xl text-xs font-bold text-slate-300 hover:text-white hover:bg-white/10 transition" title="自動環繞旋轉">
          <i data-lucide="rotate-3d" class="w-4 h-4 text-emerald-400"></i>
        </button>
        <button onclick="toggleWireframe()" id="btnXRay" class="p-2 rounded-xl text-xs font-bold text-slate-300 hover:text-white hover:bg-white/10 transition" title="透視結構模式">
          <i data-lucide="box" class="w-4 h-4 text-cyan-400"></i>
        </button>
      </div>
    </header>

    <!-- ================= BOTTOM-LEFT: CAMERA VIEW PRESETS ================= -->
    <div class="absolute bottom-5 left-4 z-20 pointer-events-none">
      <div class="glass-panel p-2 rounded-2xl pointer-events-auto flex flex-wrap items-center gap-1.5 shadow-2xl max-w-sm sm:max-w-none">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-2 hidden sm:inline">視角切換:</span>
        <button onclick="setCameraView('orbit')" class="cam-btn active px-3 py-1.5 rounded-xl text-xs font-bold bg-white/20 text-white hover:bg-white/30 transition flex items-center gap-1.5">
          <i data-lucide="compass" class="w-3.5 h-3.5 text-emerald-400"></i> 全景環視
        </button>
        <button onclick="setCameraView('street')" class="cam-btn px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300 hover:text-white hover:bg-white/10 transition flex items-center gap-1.5">
          <i data-lucide="eye" class="w-3.5 h-3.5 text-amber-400"></i> 仰望天際
        </button>
        <button onclick="setCameraView('damper')" class="cam-btn px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300 hover:text-white hover:bg-white/10 transition flex items-center gap-1.5">
          <i data-lucide="disc" class="w-3.5 h-3.5 text-yellow-400"></i> 風阻尼球 (TMD)
        </button>
        <button onclick="setCameraView('observatory')" class="cam-btn px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300 hover:text-white hover:bg-white/10 transition flex items-center gap-1.5">
          <i data-lucide="binoculars" class="w-3.5 h-3.5 text-cyan-400"></i> 89F 觀景台
        </button>
      </div>
    </div>

    <!-- ================= BOTTOM-RIGHT: INTERACTIVE CONTROLS ================= -->
    <div class="absolute bottom-5 right-4 z-20 pointer-events-none flex flex-col items-end gap-2.5">
      
      <!-- New Year Fireworks Trigger Button -->
      <button onclick="toggleFireworks()" id="btnFireworks" class="pointer-events-auto px-4 py-2.5 rounded-2xl bg-gradient-to-r from-red-600 via-pink-600 to-amber-500 hover:scale-105 active:scale-95 text-white text-xs font-black shadow-lg shadow-pink-500/30 transition-all flex items-center gap-2">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span id="fireworksLabel">啟動跨年煙火秀 🎆</span>
      </button>

      <!-- Control Drawer Trigger / Info Panel -->
      <div class="glass-panel p-3.5 rounded-3xl pointer-events-auto w-64 sm:w-72 shadow-2xl text-xs space-y-3">
        <!-- Weekday Spectrum Lights -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="font-bold text-slate-300 flex items-center gap-1">
              <i data-lucide="palette" class="w-3.5 h-3.5 text-emerald-400"></i> 一週彩虹光雕色
            </span>
            <span class="text-[10px] text-slate-400 font-mono" id="currentDayLabel">週四 • 碧玉綠</span>
          </div>
          <div class="grid grid-cols-7 gap-1" id="weekdayButtons">
            <button onclick="setTowerColor('#ef4444', '週一 • 熱情紅')" class="w-full h-5 rounded-md bg-red-500 hover:scale-110 transition" title="週一：紅"></button>
            <button onclick="setTowerColor('#f97316', '週二 • 夕陽橙')" class="w-full h-5 rounded-md bg-orange-500 hover:scale-110 transition" title="週二：橙"></button>
            <button onclick="setTowerColor('#eab308', '週三 • 璀璨黃')" class="w-full h-5 rounded-md bg-yellow-500 hover:scale-110 transition" title="週三：黃"></button>
            <button onclick="setTowerColor('#22c55e', '週四 • 翡翠綠')" class="w-full h-5 rounded-md bg-green-500 hover:scale-110 ring-2 ring-white transition" title="週四：綠"></button>
            <button onclick="setTowerColor('#3b82f6', '週五 • 湛藍海')" class="w-full h-5 rounded-md bg-blue-500 hover:scale-110 transition" title="週五：藍"></button>
            <button onclick="setTowerColor('#6366f1', '週六 • 靛青紫')" class="w-full h-5 rounded-md bg-indigo-500 hover:scale-110 transition" title="週六：靛"></button>
            <button onclick="setTowerColor('#a855f7', '週日 • 尊榮紫')" class="w-full h-5 rounded-md bg-purple-500 hover:scale-110 transition" title="週日：紫"></button>
          </div>
        </div>

        <!-- Typhoon / Earthquake Vibration Simulation -->
        <div class="pt-2 border-t border-white/10">
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-slate-300 flex items-center gap-1">
              <i data-lucide="wind" class="w-3.5 h-3.5 text-cyan-400"></i> 強風/地震模擬 (TMD動態)
            </span>
            <span class="text-[10px] text-cyan-300 font-mono font-bold" id="windSpeedLabel">無風 (0 m/s)</span>
          </div>
          <input type="range" id="windSlider" min="0" max="60" value="0" step="2" oninput="handleWindChange(this.value)" class="w-full accent-emerald-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
          <p class="text-[10px] text-slate-400 mt-1 leading-snug">
            滑動增加風速，觀察 101 大樓微幅擺動與內部 660 噸阻尼球之反相位消能物理！
          </p>
        </div>

        <!-- Damper Status Mini Card -->
        <div class="p-2 bg-white/5 rounded-xl border border-white/5 flex items-center justify-between text-[11px]">
          <span class="text-slate-400">阻尼球擺幅 (Displacement):</span>
          <span class="font-mono text-yellow-400 font-bold" id="damperOffsetVal">±0.0 cm</span>
        </div>
      </div>

    </div>

    <!-- Real-time Beacon Flash Indicator in 3D scene (Audio Warning Badge) -->
    <div class="absolute top-20 left-4 z-10 glass-panel px-3 py-1 rounded-xl text-[10px] font-mono flex items-center gap-1.5 text-slate-300">
      <span class="w-2 h-2 rounded-full bg-red-500 beacon-pulse"></span>
      <span>頂部航空警示信標：運作中 (508m 頂尖)</span>
    </div>

  </div>

  <!-- ================= THREE.JS APPLICATION CODE ================= -->
  <script>
    // Global Three.js Scene Variables
    let scene, camera, renderer, controls;
    let clock = new THREE.Clock();

    // Model Groups
    let taipei101Group = new THREE.Group();
    let towerSegments = [];
    let damperGroup = new THREE.Group();
    let damperBall, damperCables = [], hydraulicDampers = [];
    let beaconLight, beaconMesh;
    let fireworksSystem = null;
    let fireworksActive = false;

    // Environmental Lights
    let dirLight, hemiLight, ambientLight;
    let groundMesh;

    // Physics & State
    let isWireframe = false;
    let currentTowerColor = 0x22c55e; // Default Thursday Green
    let windSpeed = 0; // m/s
    let buildingSwayAngle = 0;
    let damperAngle = 0;
    let targetCameraPos = new THREE.Vector3(0, 140, 320);
    let targetLookAt = new THREE.Vector3(0, 120, 0);

    // 1. Initialize Scene & Renderer
    function init() {
      const container = document.getElementById('canvas-container');
      const canvas = document.getElementById('webgl-canvas');

      // Create Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060913); // Deep night sky
      scene.fog = new THREE.FogExp2(0x060913, 0.0018);

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 3000);
      camera.position.set(0, 140, 320);

      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      // Orbit Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.01; // Don't clip through ground
      controls.minDistance = 15;
      controls.maxDistance = 800;
      controls.target.set(0, 120, 0);
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;

      // Build Lights
      setupLighting();

      // Build Environment Plaza
      buildEnvironment();

      // Build Taipei 101 Structure
      buildTaipei101();

      // Build Fireworks Particle Engine
      initFireworks();

      // Event Listeners
      window.addEventListener('resize', onWindowResize);

      // Initialize Lucide Icons
      lucide.createIcons();

      // Start Render Loop
      animate();
    }

    // 2. Lighting Setup
    function setupLighting() {
      ambientLight = new THREE.AmbientLight(0x384152, 0.6);
      scene.add(ambientLight);

      hemiLight = new THREE.HemisphereLight(0x7dd3fc, 0x0f172a, 0.5);
      hemiLight.position.set(0, 300, 0);
      scene.add(hemiLight);

      dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(120, 350, 180);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 10;
      dirLight.shadow.camera.far = 800;
      dirLight.shadow.camera.left = -160;
      dirLight.shadow.camera.right = 160;
      dirLight.shadow.camera.top = 350;
      dirLight.shadow.camera.bottom = -50;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      // Night Spotlight on the tower base
      const spotLight = new THREE.SpotLight(0x10b981, 2, 400, Math.PI / 5, 0.4);
      spotLight.position.set(0, 10, 120);
      spotLight.target.position.set(0, 150, 0);
      scene.add(spotLight);
      scene.add(spotLight.target);
    }

    // 3. Environment & Ground Plaza
    function buildEnvironment() {
      // Ground plane
      const groundGeo = new THREE.PlaneGeometry(1200, 1200);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x0b0f19,
        roughness: 0.85,
        metalness: 0.2
      });
      groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      // Ground Plaza Grid Lines & Pathways
      const gridHelper = new THREE.GridHelper(300, 60, 0x1e293b, 0x0f172a);
      gridHelper.position.y = 0.05;
      scene.add(gridHelper);

      // Street Level Pedestrian Plaza Base (Elevated)
      const plazaGeo = new THREE.BoxGeometry(110, 1.5, 110);
      const plazaMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
      const plaza = new THREE.Mesh(plazaGeo, plazaMat);
      plaza.position.y = 0.75;
      plaza.receiveShadow = true;
      scene.add(plaza);

      // Perimeter Trees
      const treeMat = new THREE.MeshStandardMaterial({ color: 0x064e3b, roughness: 0.6 });
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });
      for (let i = -48; i <= 48; i += 16) {
        if (Math.abs(i) < 25) continue;
        createTree(i, 48, treeMat, trunkMat);
        createTree(i, -48, treeMat, trunkMat);
        createTree(48, i, treeMat, trunkMat);
        createTree(-48, i, treeMat, trunkMat);
      }
    }

    function createTree(x, z, foliageMat, trunkMat) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3, 6), trunkMat);
      trunk.position.y = 1.5;
      trunk.castShadow = true;
      tree.add(trunk);

      const crown = new THREE.Mesh(new THREE.ConeGeometry(2, 4.5, 7), foliageMat);
      crown.position.y = 4.5;
      crown.castShadow = true;
      tree.add(crown);

      tree.position.set(x, 1.5, z);
      scene.add(tree);
    }

    // 4. Procedural Textures Generation (Zero external dependencies)
    function createGlassTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Teal blue-green base glass
      ctx.fillStyle = '#0f3833';
      ctx.fillRect(0, 0, 256, 256);

      // Window Grid Louvers
      ctx.strokeStyle = '#1e6659';
      ctx.lineWidth = 4;
      for (let y = 0; y < 256; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(256, y);
        ctx.stroke();
      }
      for (let x = 0; x < 256; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 256);
        ctx.stroke();
      }

      // Lit office interior windows
      ctx.fillStyle = 'rgba(254, 240, 138, 0.7)';
      for (let y = 4; y < 256; y += 32) {
        for (let x = 4; x < 256; x += 32) {
          if (Math.random() > 0.45) {
            ctx.fillRect(x + 4, y + 4, 20, 20);
          }
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      return texture;
    }

    // 5. Build Taipei 101 Main Architectural Model
    function buildTaipei101() {
      const glassTex = createGlassTexture();

      // Materials
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0x14532d,
        emissive: currentTowerColor,
        emissiveIntensity: 0.35,
        emissiveMap: glassTex,
        map: glassTex,
        metalness: 0.35,
        roughness: 0.15,
        transmission: 0.25,
        transparent: true,
        opacity: 0.95,
        reflectivity: 0.8
      });

      const structuralSteelMat = new THREE.MeshStandardMaterial({
        color: 0x334155,
        metalness: 0.85,
        roughness: 0.3
      });

      const goldOrnamentMat = new THREE.MeshStandardMaterial({
        color: 0xf59e0b,
        metalness: 0.9,
        roughness: 0.2
      });

      // ================= A. PODIUM BASE (Floors 1 - 6 Shopping Mall) =================
      const podiumGroup = new THREE.Group();
      
      // Tier 1 Base Mall
      const podiumB1 = new THREE.Mesh(new THREE.BoxGeometry(64, 12, 64), structuralSteelMat);
      podiumB1.position.y = 6;
      podiumB1.castShadow = true;
      podiumB1.receiveShadow = true;
      podiumGroup.add(podiumB1);

      // Curved Mall Entrance Canopies (信義路 & 松智路門廳)
      for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 2) {
        const canopy = new THREE.Mesh(new THREE.CylinderGeometry(14, 16, 4, 16, 1, false, 0, Math.PI), structuralSteelMat);
        canopy.rotation.z = Math.PI / 2;
        canopy.rotation.y = angle;
        canopy.position.set(Math.sin(angle) * 32, 4, Math.cos(angle) * 32);
        podiumGroup.add(canopy);
      }

      // Tier 2 Setback Mall Roof
      const podiumB2 = new THREE.Mesh(new THREE.BoxGeometry(54, 8, 54), glassMat);
      podiumB2.position.y = 16;
      podiumB2.castShadow = true;
      podiumGroup.add(podiumB2);

      // Tier 3 Skylight Glass Dome
      const skylight = new THREE.Mesh(new THREE.CylinderGeometry(16, 22, 5, 8), glassMat);
      skylight.position.y = 22.5;
      podiumGroup.add(skylight);

      taipei101Group.add(podiumGroup);

      // ================= B. LOWER TOWER TRANSITION (Floors 7 - 25) =================
      // Tapered Pyramid Pedestal Base (下寬上縮的微傾過渡座)
      const pedestalHeight = 36;
      const pedestalGeo = new THREE.CylinderGeometry(14.5, 19.5, pedestalHeight, 4);
      pedestalGeo.rotateY(Math.PI / 4); // Orient square faces along X and Z axes
      const pedestal = new THREE.Mesh(pedestalGeo, glassMat);
      pedestal.position.y = 25 + pedestalHeight / 2;
      pedestal.castShadow = true;
      taipei101Group.add(pedestal);

      // Corner Mega Columns for Pedestal (四角巨型結構斜柱)
      for (let i = 0; i < 4; i++) {
        const rad = (i * Math.PI) / 2 + Math.PI / 4;
        const colGeo = new THREE.CylinderGeometry(1.6, 2.2, pedestalHeight, 8);
        const col = new THREE.Mesh(colGeo, structuralSteelMat);
        col.position.set(Math.sin(rad) * 21, 25 + pedestalHeight / 2, Math.cos(rad) * 21);
        col.castShadow = true;
        taipei101Group.add(col);
      }

      // ================= C. EIGHT BAMBOO INVERTED TRAPEZOID TIERS (26 - 90 樓，八節竹節) =================
      const startY = 61;
      const tierHeight = 16.5;
      const bottomRadius = 13.5;
      const topRadius = 15.5; // Flared outward top creating inverted trapezoid pagoda module!

      for (let t = 0; t < 8; t++) {
        const tierGroup = new THREE.Group();
        const currentTierBaseY = startY + t * tierHeight;

        // Inverted Truncated Pyramid Segment Body (倒梯形體)
        const tierGeo = new THREE.CylinderGeometry(topRadius, bottomRadius, tierHeight, 4);
        tierGeo.rotateY(Math.PI / 4);
        const tierMesh = new THREE.Mesh(tierGeo, glassMat);
        tierMesh.position.y = tierHeight / 2;
        tierMesh.castShadow = true;
        tierMesh.receiveShadow = true;
        tierGroup.add(tierMesh);

        // Overhang Cornice / Eave (向外懸挑重簷)
        const eaveGeo = new THREE.BoxGeometry(topRadius * 1.48, 1.2, topRadius * 1.48);
        const eaveMesh = new THREE.Mesh(eaveGeo, structuralSteelMat);
        eaveMesh.position.y = tierHeight;
        eaveMesh.castShadow = true;
        tierGroup.add(eaveMesh);

        // Mega Columns at the 4 corners of each tier
        for (let c = 0; c < 4; c++) {
          const cornerAngle = (c * Math.PI) / 2 + Math.PI / 4;
          const cornerCol = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.9, tierHeight, 8), structuralSteelMat);
          cornerCol.position.set(Math.sin(cornerAngle) * (topRadius * 0.98), tierHeight / 2, Math.cos(cornerAngle) * (topRadius * 0.98));
          cornerCol.castShadow = true;
          tierGroup.add(cornerCol);
        }

        // Circular Ancient Coin (古錢幣) & Ruyi (如意) Medallion Ornaments on 4 faces
        for (let f = 0; f < 4; f++) {
          const faceAngle = (f * Math.PI) / 2;
          const faceDist = (topRadius + bottomRadius) / 2 * 0.72;

          // Ancient Dragon Coin Ring
          const coinRing = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.25, 8, 24), goldOrnamentMat);
          coinRing.position.set(Math.sin(faceAngle) * faceDist, tierHeight * 0.72, Math.cos(faceAngle) * faceDist);
          coinRing.rotation.y = faceAngle;
          tierGroup.add(coinRing);

          // Inner square hole of coin
          const innerSquare = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.2), goldOrnamentMat);
          innerSquare.position.copy(coinRing.position);
          innerSquare.rotation.y = faceAngle;
          tierGroup.add(innerSquare);

          // Ruyi Cloud Eave Emblem (如意祥雲雲紋飾板)
          const ruyiBar = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 4, 8), goldOrnamentMat);
          ruyiBar.rotation.z = Math.PI / 2;
          ruyiBar.rotation.y = faceAngle;
          ruyiBar.position.set(Math.sin(faceAngle) * (faceDist + 0.3), tierHeight * 0.9, Math.cos(faceAngle) * (faceDist + 0.3));
          tierGroup.add(ruyiBar);
        }

        tierGroup.position.y = currentTierBaseY;
        taipei101Group.add(tierGroup);
        towerSegments.push(tierGroup);
      }

      // ================= D. TUNED MASS DAMPER (87 - 92 樓 風阻尼球) =================
      buildDamperSystem(startY + 7 * tierHeight + 6);

      // ================= E. TOWER CROWN & PINNACLE (91 - 101 樓 塔冠與尖塔) =================
      const crownBaseY = startY + 8 * tierHeight;

      // Outdoor Observatory Balcony (91F 戶外觀景台)
      const obsGeo = new THREE.BoxGeometry(18, 3.5, 18);
      const obsMesh = new THREE.Mesh(obsGeo, structuralSteelMat);
      obsMesh.position.y = crownBaseY + 1.75;
      taipei101Group.add(obsMesh);

      // Stepped Pyramid Tapering Sections (塔頂階梯漸縮結構)
      const crownTiers = [
        { w: 15, h: 6 },
        { w: 12, h: 5 },
        { w: 9, h: 4 },
        { w: 6, h: 3 }
      ];
      let currCrownY = crownBaseY + 3.5;
      crownTiers.forEach(t => {
        const cMesh = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.w), glassMat);
        cMesh.position.y = currCrownY + t.h / 2;
        cMesh.castShadow = true;
        taipei101Group.add(cMesh);
        currCrownY += t.h;
      });

      // Top Dome Base
      const domeBase = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 4.5, 3, 16), structuralSteelMat);
      domeBase.position.y = currCrownY + 1.5;
      taipei101Group.add(domeBase);
      currCrownY += 3;

      // Metal Communications Lattice Spire (508m 針尖避雷針天線，長達 45 單位)
      const spireHeight = 42;
      const spireGeo = new THREE.CylinderGeometry(0.3, 1.8, spireHeight, 8);
      const spire = new THREE.Mesh(spireGeo, structuralSteelMat);
      spire.position.y = currCrownY + spireHeight / 2;
      spire.castShadow = true;
      taipei101Group.add(spire);

      // Red Aviation Obstacle Beacon at the absolute peak (頂端航空閃爍紅燈)
      beaconMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
      );
      beaconMesh.position.y = currCrownY + spireHeight;
      taipei101Group.add(beaconMesh);

      beaconLight = new THREE.PointLight(0xff0000, 3, 80);
      beaconLight.position.copy(beaconMesh.position);
      taipei101Group.add(beaconLight);

      scene.add(taipei101Group);
    }

    // 6. Tuned Mass Damper (TMD) Construction
    function buildDamperSystem(centerY) {
      damperGroup.position.set(0, centerY, 0);

      // TMD Interior Room Platform (Circular floor ring)
      const platformGeo = new THREE.RingGeometry(5.5, 12, 32);
      platformGeo.rotateX(-Math.PI / 2);
      const platformMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
      const platform = new THREE.Mesh(platformGeo, platformMat);
      damperGroup.add(platform);

      // Giant 660-tonne Golden Sphere (直徑 5.5 米黃金球)
      const ballGeo = new THREE.SphereGeometry(4.2, 36, 36);
      const ballMat = new THREE.MeshStandardMaterial({
        color: 0xf59e0b,
        metalness: 0.92,
        roughness: 0.18
      });
      damperBall = new THREE.Mesh(ballGeo, ballMat);
      damperBall.position.set(0, 0, 0);
      damperBall.castShadow = true;
      damperGroup.add(damperBall);

      // 8 Braided Steel Suspension Cables (8 根吊掛鋼纜)
      const cableMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9, roughness: 0.2 });
      for (let i = 0; i < 8; i++) {
        const ang = (i * Math.PI * 2) / 8;
        const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 9, 8), cableMat);
        cable.position.set(Math.sin(ang) * 1.8, 4.5, Math.cos(ang) * 1.8);
        damperGroup.add(cable);
        damperCables.push(cable);
      }

      // 8 Hydraulic Dampers at bottom ring (8 組底座環狀液壓阻尼活塞)
      const pistonMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.3 });
      for (let j = 0; j < 8; j++) {
        const ang = (j * Math.PI * 2) / 8 + Math.PI / 8;
        const piston = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5, 8), pistonMat);
        piston.position.set(Math.sin(ang) * 4.5, -1.5, Math.cos(ang) * 4.5);
        piston.rotation.z = Math.PI / 3;
        piston.rotation.y = ang;
        damperGroup.add(piston);
        hydraulicDampers.push(piston);
      }

      taipei101Group.add(damperGroup);
    }

    // 7. New Year's Eve Fireworks Particle System
    function initFireworks() {
      const particleCount = 2000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const velocities = [];

      const colorPalette = [
        new THREE.Color(0xff0055), // Pink/Red
        new THREE.Color(0xffcc00), // Gold
        new THREE.Color(0x00d4ff), // Cyan
        new THREE.Color(0xa855f7), // Purple
        new THREE.Color(0x22c55e)  // Green
      ];

      for (let i = 0; i < particleCount; i++) {
        // Distribute launchers across 8 tiers & spire
        const tierIdx = Math.floor(Math.random() * 9);
        const launchY = tierIdx === 8 ? 245 : (61 + tierIdx * 16.5 + 16.5);
        const angle = Math.random() * Math.PI * 2;
        const radius = tierIdx === 8 ? 3 : 16;

        positions[i * 3] = Math.sin(angle) * radius;
        positions[i * 3 + 1] = launchY;
        positions[i * 3 + 2] = Math.cos(angle) * radius;

        // Radial outward blast speed
        const speed = 1.2 + Math.random() * 2.8;
        velocities.push({
          x: Math.sin(angle) * speed + (Math.random() - 0.5) * 0.8,
          y: (Math.random() - 0.2) * 2.5,
          z: Math.cos(angle) * speed + (Math.random() - 0.5) * 0.8,
          originX: positions[i * 3],
          originY: positions[i * 3 + 1],
          originZ: positions[i * 3 + 2],
          life: Math.random() * 1.5
        });

        const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const particleMat = new THREE.PointsMaterial({
        size: 2.2,
        vertexColors: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      fireworksSystem = new THREE.Points(geometry, particleMat);
      fireworksSystem.userData = { velocities: velocities };
      scene.add(fireworksSystem);
    }

    function toggleFireworks() {
      fireworksActive = !fireworksActive;
      const btn = document.getElementById('btnFireworks');
      const label = document.getElementById('fireworksLabel');
      
      if (fireworksActive) {
        btn.classList.add('ring-4', 'ring-pink-400', 'scale-105');
        label.innerText = '煙火慶典施放中 ✨ (點擊關閉)';
        // Switch to night view for best fireworks contrast
        setLightingTime('night');
      } else {
        btn.classList.remove('ring-4', 'ring-pink-400', 'scale-105');
        label.innerText = '啟動跨年煙火秀 🎆';
        fireworksSystem.material.opacity = 0;
      }
    }

    // 8. Day/Sunset/Night Theme Controls
    function setLightingTime(mode) {
      document.querySelectorAll('.time-btn').forEach(b => {
        b.classList.remove('bg-emerald-600', 'text-white', 'active');
        b.classList.add('text-slate-300');
      });

      if (mode === 'day') {
        document.getElementById('btnDay').classList.add('bg-emerald-600', 'text-white', 'active');
        scene.background.set(0x7dd3fc); // Daylight blue sky
        scene.fog.color.set(0x93c5fd);
        dirLight.intensity = 1.4;
        dirLight.color.set(0xffffff);
        ambientLight.intensity = 0.8;
        groundMesh.material.color.set(0x334155);
      } else if (mode === 'sunset') {
        document.getElementById('btnSunset').classList.add('bg-emerald-600', 'text-white', 'active');
        scene.background.set(0x7c2d12); // Warm sunset orange
        scene.fog.color.set(0xc2410c);
        dirLight.intensity = 1.2;
        dirLight.color.set(0xfdba74);
        ambientLight.intensity = 0.6;
        groundMesh.material.color.set(0x1e293b);
      } else {
        document.getElementById('btnNight').classList.add('bg-emerald-600', 'text-white', 'active');
        scene.background.set(0x060913); // Deep cyber night
        scene.fog.color.set(0x060913);
        dirLight.intensity = 0.4;
        dirLight.color.set(0x818cf8);
        ambientLight.intensity = 0.5;
        groundMesh.material.color.set(0x0b0f19);
      }
    }

    // 9. Tower Weekday Color Lighting Selector
    function setTowerColor(hexStr, labelText) {
      currentTowerColor = new THREE.Color(hexStr);
      document.getElementById('currentDayLabel').innerText = labelText;

      // Update materials on tower
      taipei101Group.traverse(child => {
        if (child.isMesh && child.material && child.material.isMeshPhysicalMaterial) {
          child.material.emissive.copy(currentTowerColor);
        }
      });
    }

    // 10. Camera Presets
    function setCameraView(preset) {
      document.querySelectorAll('.cam-btn').forEach(b => {
        b.classList.remove('bg-white/20', 'text-white', 'active');
        b.classList.add('text-slate-300');
      });
      event.currentTarget.classList.add('bg-white/20', 'text-white', 'active');

      if (preset === 'orbit') {
        targetCameraPos.set(0, 140, 320);
        targetLookAt.set(0, 120, 0);
        controls.autoRotate = true;
      } else if (preset === 'street') {
        // Dramatic low angle street-level view looking straight up!
        targetCameraPos.set(20, 4, 65);
        targetLookAt.set(0, 160, 0);
        controls.autoRotate = false;
      } else if (preset === 'damper') {
        // Close-up inspection view inside the 88F Damper chamber!
        targetCameraPos.set(0, 185, 20);
        targetLookAt.set(0, 182, 0);
        controls.autoRotate = false;
      } else if (preset === 'observatory') {
        // 89F Observatory View looking out over Taipei
        targetCameraPos.set(30, 205, 30);
        targetLookAt.set(0, 195, 0);
        controls.autoRotate = true;
      }
    }

    // 11. Physics Controls (Typhoon / Earthquake Simulation)
    function handleWindChange(val) {
      windSpeed = parseFloat(val);
      document.getElementById('windSpeedLabel').innerText = windSpeed > 0 ? `${windSpeed} m/s (颱風級)` : `無風 (0 m/s)`;
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
      document.getElementById('btnRotate').classList.toggle('bg-white/20', controls.autoRotate);
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      taipei101Group.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.wireframe = isWireframe;
        }
      });
      document.getElementById('btnXRay').classList.toggle('bg-white/20', isWireframe);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // 12. Main Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Smooth camera interpolation towards target
      camera.position.lerp(targetCameraPos, 0.04);
      controls.target.lerp(targetLookAt, 0.04);
      controls.update();

      // Aviation Red Beacon Light Pulsing (1 Hz)
      const beaconIntensity = Math.sin(time * 6) > 0 ? 3.5 : 0.2;
      beaconLight.intensity = beaconIntensity;
      beaconMesh.material.color.setHex(beaconIntensity > 1 ? 0xff0000 : 0x550000);

      // Tuned Mass Damper (TMD) Harmonic Physics Simulation
      if (windSpeed > 0) {
        // Natural frequency of Taipei 101 sway is approx 0.15 Hz (~7 second period)
        const swayFreq = 1.2;
        const maxSway = (windSpeed / 60) * 0.035; // Building sway angle
        buildingSwayAngle = Math.sin(time * swayFreq) * maxSway;
        taipei101Group.rotation.z = buildingSwayAngle;

        // Tuned Damper Sphere swings in opposite phase (180 deg out-of-phase damping)
        const damperSway = -Math.sin(time * swayFreq - 0.4) * (windSpeed / 60) * 3.6;
        damperBall.position.x = damperSway;

        // Displace suspension cables
        damperCables.forEach((c, idx) => {
          c.rotation.z = -damperSway * 0.15;
        });

        // Update HUD displacement reading (max real Taipei 101 damper record is ~100cm)
        const offsetCm = Math.abs(damperSway * 28).toFixed(1);
        document.getElementById('damperOffsetVal').innerText = `±${offsetCm} cm`;
      } else {
        // Return to rest smoothly
        taipei101Group.rotation.z *= 0.95;
        damperBall.position.x *= 0.92;
        damperCables.forEach(c => c.rotation.z *= 0.92);
        document.getElementById('damperOffsetVal').innerText = `±0.0 cm`;
      }

      // Fireworks Particle Animation
      if (fireworksActive && fireworksSystem) {
        fireworksSystem.material.opacity = 1;
        const positions = fireworksSystem.geometry.attributes.position.array;
        const velocities = fireworksSystem.userData.velocities;

        for (let i = 0; i < velocities.length; i++) {
          const v = velocities[i];
          positions[i * 3] += v.x;
          positions[i * 3 + 1] += v.y;
          positions[i * 3 + 2] += v.z;

          // Gravity effect
          v.y -= 0.025;
          v.life -= delta * 0.6;

          // Recycle particle burst
          if (v.life <= 0) {
            positions[i * 3] = v.originX;
            positions[i * 3 + 1] = v.originY;
            positions[i * 3 + 2] = v.originZ;
            v.life = 1.0 + Math.random() * 0.8;
            v.y = (Math.random() - 0.2) * 2.2;
          }
        }
        fireworksSystem.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    // Start on DOM Ready
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
